<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB_1 | Кобленц М.А. | P3206</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
    <h1>Лабораторная работа №1</h1>
    <div class="student-info">
        <p>ФИО: <span class="student-name">Кобленц Мария Алексеевна</span></p>
        <p>Группа: <span class="group-number">P3206</span></p>
        <p>Вариант: <span class="variant-number">12605</span></p>
    </div>
</header>

<main class="container">
    <section class="canvas-section">
        <h2>График области</h2>
        <canvas id="coordinate-plane" width="600" height="600"></canvas>
    </section>

    <section class="form-section">
        <h2>Ввод координат</h2>
        <form id="point-form" class="point-form" novalidate>
            <div class="form-group">
                <label for="x-input">Координата Х:</label>
                <input type="number" id="x-input" name="x" step="0.1" min="-5" max="5" required placeholder="от -5 до 5">
                <span class="error-message" id="x-error"></span>
            </div>
            <div class="form-group">
                <label for="y-input">Координата Y:</label>
                <input type="number" id="y-input" name="y" step="0.1" min="-5" max="5" required placeholder="от -5 до 5">
                <span class="error-message" id="y-error"></span>
            </div>
            <div class="form-group">
                <label for="r-input">Радиус R::</label>
                <input type="number" id="r-input" name="r" step="0.1" min="-5" max="5" required placeholder="от -5 до 5">
                <span class="error-message" id="r-error"></span>
            </div>
            <button type="submit" class="submit-btn">Проверить точку</button>
            <script src="script.js"></script>
        </form>
    </section>

    <section class="results-section">
        <h2>Результаты</h2>
    </section>
</main>
</body>
</html>
